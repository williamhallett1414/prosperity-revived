<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Prosperity Revived — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #F2F6FA;
      color: #0A1A2F;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .container {
      text-align: center;
      max-width: 320px;
    }
    .icon {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(253, 156, 45, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0A1A2F;
    }
    p {
      font-size: 15px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .verse {
      font-style: italic;
      font-size: 14px;
      color: #3C4E53;
      background: rgba(253, 156, 45, 0.08);
      border-left: 3px solid #FD9C2D;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 28px;
      text-align: left;
    }
    .verse cite {
      display: block;
      font-style: normal;
      font-weight: 600;
      font-size: 12px;
      color: #FD9C2D;
      margin-top: 6px;
    }
    button {
      background: #FD9C2D;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      min-height: 48px;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🙏</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Please reconnect to continue your journey.</p>
    <div class="verse">
      "Be still, and know that I am God."
      <cite>— Psalm 46:10</cite>
    </div>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
